name: Build Hibiki EQAPO

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: read

concurrency:
  group: hibiki-eqapo-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-installer-x64:
    name: Build Hibiki EQAPO x64 installer
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.2"
          architecture: "x64"
          check-latest: false

      - name: Verify public source history
        shell: pwsh
        run: .\scripts\test-public-history.ps1 -Revision HEAD

      - name: Run regression tests
        shell: pwsh
        run: python -m unittest discover -s .\tests -p "test_*.py" -v

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
        with:
          msbuild-architecture: x64

      - name: Build installer
        shell: pwsh
        run: |
          .\scripts\build-installer-x64.ps1 `
            -Configuration "${{ inputs.configuration || 'Release' }}"

      - name: Audit Monitor VST3 PE imports
        if: ${{ (inputs.configuration || 'Release') == 'Release' }}
        shell: pwsh
        run: .\scripts\test-monitor-vst3-binary.ps1 -Configuration "Release"

      - name: Test VST direct-path and hardlink self-load guard
        if: ${{ (inputs.configuration || 'Release') == 'Release' }}
        shell: pwsh
        run: .\scripts\test-vst-self-load-guard.ps1 -Configuration "Release"

      - name: Test runtime loudness processing
        shell: pwsh
        run: .\scripts\test-runtime-loudness.ps1 -Configuration "${{ inputs.configuration || 'Release' }}"

      - name: Test built out-of-process VST host lifecycle
        shell: pwsh
        run: python -m unittest discover -s .\tests -p "test_outproc_vst_lifecycle.py" -v

      - name: Capture UI theme and DPI regression matrix
        shell: pwsh
        run: |
          .\scripts\capture-ui-regression.ps1 `
            -Configuration "${{ inputs.configuration || 'Release' }}"

      - name: Upload UI regression matrix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Hibiki-EQAPO-${{ inputs.configuration || 'Release' }}-ui-regression
          path: |
            artifacts/ui-regression/*.png
            artifacts/ui-regression/manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Locate installer
        id: installer
        shell: pwsh
        run: |
          $version = .\scripts\get-project-version.ps1
          $path = "Setup/Hibiki-EQAPO-x64-$version.exe"
          if (!(Test-Path -LiteralPath $path)) { throw "Installer not found: $path" }
          "path=$path" >> $env:GITHUB_OUTPUT
          "checksum=$path.sha256" >> $env:GITHUB_OUTPUT

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Hibiki-EQAPO-x64-${{ inputs.configuration || 'Release' }}-installer
          path: |
            ${{ steps.installer.outputs.path }}
            ${{ steps.installer.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14
